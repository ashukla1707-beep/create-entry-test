name: Sorry Sugar Scrape
on:
  push:
    branches:
      - chatgpt-sorry-sugar-scrape
    paths:
      - "sorry_sugar_scrape/**"
      - ".github/workflows/sorry-sugar-scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python sorry_sugar_scrape/scrape.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrape_output
          git diff --cached --quiet || git commit -m "Add Sorry Sugar scrape output [skip ci]"
          git push
