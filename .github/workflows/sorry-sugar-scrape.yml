name: Sorry Sugar scrape
on:
  push:
    branches: [sorry-sugar-scrape-20261002]

permissions:
  contents: write

jobs:
  scrape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sorry-sugar-scrape-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python sorry_sugar_scrape.py
      - name: Commit scrape output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrape_output/
          git commit -m "Add Sorry Sugar scraped reviews" || exit 0
          git push
