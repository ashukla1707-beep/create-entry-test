name: Package Sorry Sugar Data
on:
  push:
    branches:
      - chatgpt-sorry-sugar-scrape
    paths:
      - ".github/workflows/package-sorry-sugar.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: sorry-sugar-scrape-data
          path: scrape_output/
          if-no-files-found: error
